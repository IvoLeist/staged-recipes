context:
  version: "0.3.3"
  python_min: "3.10"

package:
  name: fave-recode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fave-recode/fave_recode-${{ version }}.tar.gz
  sha256: 5b20415bba06fe663c5d615396cdc3434e693ad2ba6a17d97a4efbba1209b950

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fave_recode = fave_recode.fave_recode:fave_recode

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - aligned-textgrid <0.9,>=0.8
    - pyyaml <7.0,>=6.0
    - cerberus <2.0.0,>=1.3.5
    - click <9.0.0,>=8.1.7
    - cloup <4.0.0,>=3.0.2

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - fave_recode
      pip_check: true
  - script:
      - fave_recode --help

about:
  homepage: https://forced-alignment-and-vowel-extraction.github.io/fave-recode
  summary: A package for recoding Praat TextGrids
  license: GPL-3.0-only
  license_file: LICENSE.md
  repository: https://github.com/Forced-Alignment-and-Vowel-Extraction/fave-recode

extra:
  recipe-maintainers:
    - IvoLeist
