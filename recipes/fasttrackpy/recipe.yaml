context:
  version: "0.6.1"
  # conda-forge's scipy >=1.15.3 builds require Python >=3.11.
  python_min: "3.11"

package:
  name: fasttrackpy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fasttrackpy/fasttrackpy-${{ version }}.tar.gz
  sha256: 5c975cf8c90e374aa703102d03d8869d9b64024a7018eae7c8615a06407eda28

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fasttrack = fasttrackpy.cli:fasttrack

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.10.0,<0.11.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - aligned-textgrid >=0.8.1
    - click >=8.3.1
    - cloudpickle >=3.1.2
    - cloup >=3.0.8
    - filetype >=1.2.0
    - joblib >=1.5.3
    - matplotlib-base >=3.10.8
    - numba >=0.61.0
    - polars >=1.38.1
    - praat-parselmouth >=0.4.7
    - pyyaml >=6.0.3
    - scipy >=1.15.3
    - tqdm >=4.67.3

tests:
  - python:
      python_version: "3.12.*"
      imports:
        - fasttrackpy
      pip_check: true
  - script:
      - fasttrack --help

about:
  homepage: https://fasttrackiverse.github.io/fasttrackpy/
  summary: A python implementation of FastTrack
  license: MIT
  # The sdist omits LICENSE; vendored from upstream commit
  # 8eb4bb354cc152082798cc81da862a30c396118c.
  license_file: LICENSE
  repository: https://github.com/FastTrackiverse/fasttrackpy

extra:
  recipe-maintainers:
    - IvoLeist
