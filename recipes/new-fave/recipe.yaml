context:
  version: "1.3.0"

package:
  name: new-fave
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/new-fave/new_fave-${{ version }}.tar.gz
  sha256: 42b12360f95ea8a38ef8acb2ee074c7637f5083248d9445a1a77e58898982017

build:
  # conda-forge's scipy >=1.15.3 builds require Python >=3.11.
  skip: match(python, "<3.11") or match(python, ">=3.14")
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fave-extract = new_fave.extract:fave_extract

requirements:
  host:
    - python
    - uv-build >=0.10.0,<0.11.0
    - pip
  run:
    - python
    - aligned-textgrid >=0.8.1
    - click >=8.3.1
    - cloudpickle >=3.1.2
    - cloup >=3.0.8
    - fastexcel >=0.19.0
    - fasttrackpy >=0.6.1
    - fave-measurement-point >=0.1.5
    - fave-recode >=0.3.3
    - librosa >=0.11.0
    - numpy <=2.2
    - polars >=1.38.0
    - if: win
      then: python-magic-bin >=0.4.14
      else: python-magic >=0.4.27
    - scipy >=1.15.3
    - toml >=0.10.2
    - tqdm >=4.67.3

tests:
  - python:
      imports:
        - new_fave
      pip_check: true
  - script:
      - fave-extract --help

about:
  homepage: https://pypi.org/project/new-fave/
  summary: New Vowel Extraction Suite
  license: GPL-3.0-or-later
  # The sdist omits LICENSE; vendored from upstream commit
  # 6773b135893ad3be1ec9c89f8010ad1c4dd799db.
  license_file: LICENSE

extra:
  recipe-maintainers:
    - IvoLeist
